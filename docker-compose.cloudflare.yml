# Cloudflare personal mode — no signup/login, Open WebUI on :8080.
# Usage:
#   ./scripts/up-cloudflare.sh
#   # or:
#   docker compose -f docker-compose.yml -f docker-compose.cloudflare.yml up -d
#
# Set in .env (up-cloudflare.sh does this):
#   WEBUI_AUTH=false
#   ENABLE_SIGNUP=false
#   OPEN_WEBUI_PORT=8080
#   OPEN_WEBUI_BIND=0.0.0.0   # or 127.0.0.1 for cloudflared tunnel only
#
# Point Cloudflare at host:8080. FreeLLMAPI stays on 127.0.0.1:3001.

services:
  open-webui:
    environment:
      WEBUI_AUTH: "false"
      ENABLE_SIGNUP: "false"
