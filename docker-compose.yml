# ChatFRE — FreeLLMAPI + Open WebUI (+ optional Caddy for personal servers)
#
# Local / SSH-tunnel use:
#   cp .env.example .env && ./scripts/up.sh
#
# Personal server (HTTPS reverse proxy + Open WebUI login):
#   cp .env.example .env   # fill DOMAIN, emails, secrets, FREELLMAPI_API_KEY
#   docker compose -f docker-compose.yml -f docker-compose.server.yml --profile server up -d

services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    environment:
      NODE_ENV: production
      PORT: "3001"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (openssl rand -hex 32)}
    ports:
      # Always localhost — never expose FreeLLMAPI to the public internet.
      - "127.0.0.1:${FREELLMAPI_PORT:-3001}:3001"
    volumes:
      - freellmapi-data:/app/server/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/ping').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    depends_on:
      freellmapi:
        condition: service_healthy
    environment:
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: http://freellmapi:3001/v1
      OPENAI_API_KEY: ${FREELLMAPI_API_KEY:-}
      WEBUI_AUTH: ${WEBUI_AUTH:-false}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-}
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-true}
      ENABLE_VERSION_UPDATE_CHECK: "false"
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
    ports:
      # Localhost-only direct access (SSH tunnel / on-box). Public traffic goes via Caddy.
      - "127.0.0.1:${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  caddy:
    profiles: ["server"]
    image: caddy:2
    depends_on:
      - open-webui
    ports:
      - "${CADDY_HTTP_BIND:-0.0.0.0}:80:80"
      - "${CADDY_HTTPS_BIND:-0.0.0.0}:443:443"
      - "${CADDY_HTTPS_BIND:-0.0.0.0}:443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env for server mode (e.g. chat.example.com)}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  freellmapi-data:
  open-webui-data:
  caddy-data:
  caddy-config:
