# ChatFRE — FreeLLMAPI + Open WebUI
#
# FreeLLMAPI: OpenAI-compatible gateway over free LLM tiers (routing, failover, quotas)
# Open WebUI: chat frontend
#
# Quick start:
#   cp .env.example .env
#   # set ENCRYPTION_KEY (openssl rand -hex 32)
#   docker compose up -d
#   open http://127.0.0.1:3001  → FreeLLMAPI Keys page → add provider keys → copy unified key
#   put FREELLMAPI_API_KEY=... into .env and: docker compose up -d open-webui
#   open http://127.0.0.1:3000  → Open WebUI

services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    environment:
      NODE_ENV: production
      PORT: "3001"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (openssl rand -hex 32)}
    ports:
      # Dashboard + API. Bound to localhost by default (single-user gateway).
      - "${HOST_BIND:-127.0.0.1}:${FREELLMAPI_PORT:-3001}:3001"
    volumes:
      - freellmapi-data:/app/server/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/ping').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    depends_on:
      freellmapi:
        condition: service_healthy
    environment:
      # Talk to FreeLLMAPI on the compose network (not localhost).
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: http://freellmapi:3001/v1
      OPENAI_API_KEY: ${FREELLMAPI_API_KEY:-}
      # Personal / single-user default. Set WEBUI_AUTH=true for login.
      WEBUI_AUTH: ${WEBUI_AUTH:-false}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-}
      ENABLE_VERSION_UPDATE_CHECK: "false"
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
    ports:
      - "${HOST_BIND:-127.0.0.1}:${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  freellmapi-data:
  open-webui-data:
